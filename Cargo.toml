[package]
name = "mattbusel-mem-graph"
version = "0.3.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "In-memory knowledge graph for agents: typed entities and relationships, time-bounded facts with point-in-time queries, traversal, text search, subgraphs, JSON and binary save/load, petgraph interop"
repository = "https://github.com/Mattbusel/mem-graph"
documentation = "https://docs.rs/mattbusel-mem-graph"
readme = "README.md"
keywords = ["knowledge-graph", "graph", "agents", "memory", "temporal"]
categories = ["data-structures", "algorithms"]

[lib]
# Published as mattbusel-mem-graph (the crates.io name mem-graph belongs to an
# unrelated crate). The library keeps the name mem_graph: `use mem_graph::...`.
name = "mem_graph"

[features]
# Convert to/from petgraph and run its algorithms (weighted shortest paths and more).
petgraph = ["dep:petgraph"]
# Compact binary save/load (postcard) next to the always-available JSON.
binary = ["dep:postcard"]
# serde support is always compiled in (the graph, entities and relationships
# implement Serialize/Deserialize without any feature). This feature does
# nothing; it exists so `features = ["serde"]` resolves for people who expect it.
serde = []

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"], optional = true }
postcard = { version = "1", default-features = false, features = ["use-std"], optional = true }

[dev-dependencies]
criterion = { version = "0.5" }
petgraph = "0.8"
proptest = "1"

[[bench]]
name = "graph_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
